<!-- @dsCard group="Instagram" viewport="1200x700" name="Instagram Post System" subtitle="4 brand content modes — Premium Navy · Viral Dark · Tropical · Warm Coral" -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Content System — Nha Trang Insider</title>
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>* { box-sizing: border-box; margin: 0; padding: 0; } body { background: #EAEAF0; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── Star positions (fixed, not random) ────────────────────────
const STARS = [
  {top:'7%',left:'14%',s:7}, {top:'11%',left:'68%',s:5}, {top:'18%',left:'44%',s:9},
  {top:'5%', left:'88%',s:5}, {top:'22%',left:'82%',s:4}, {top:'14%',left:'30%',s:6},
  {top:'28%',left:'56%',s:4}, {top:'9%', left:'52%',s:7}, {top:'20%',left:'12%',s:4},
  {top:'32%',left:'90%',s:6}, {top:'6%', left:'76%',s:5}, {top:'25%',left:'38%',s:3},
];

// ── Post Templates (each 1080×1080) ───────────────────────────

function NavyPost() {
  return (
    <div style={{ width:1080, height:1080, background:'linear-gradient(170deg,#06091C 0%,#0D1741 45%,#142256 100%)', position:'relative', overflow:'hidden', fontFamily:'Montserrat,sans-serif' }}>
      {STARS.map((st,i) => (
        <div key={i} style={{ position:'absolute', top:st.top, left:st.left, width:st.s, height:st.s, borderRadius:'50%', background:'#E8C86A', boxShadow:`0 0 ${st.s*2}px #E8C86A`, opacity:0.9 }} />
      ))}
      <img src="../../assets/logo.png" style={{ position:'absolute', top:56, right:56, width:110, height:110, objectFit:'contain' }} alt="logo" />
      <div style={{ position:'absolute', bottom:96, left:72, right:72 }}>
        <div style={{ height:4, background:'linear-gradient(90deg,#A87210,#C9941A,#E8C86A,#C9941A)', borderRadius:2, marginBottom:44 }} />
        <div style={{ fontSize:20, fontWeight:700, letterSpacing:'0.22em', color:'var(--color-gold-500)', textTransform:'uppercase', marginBottom:28 }}>Реальные цифры по сезонам</div>
        <div style={{ fontSize:82, fontWeight:900, color:'#fff', lineHeight:1.05, letterSpacing:'-0.02em', textTransform:'uppercase', marginBottom:40 }}>Сколько стоят в очереди в Камрань?</div>
        <div style={{ fontSize:36, fontWeight:400, color:'rgba(255,255,255,0.72)', lineHeight:1.55 }}>Разбираем по месяцам и сезонам — от высокого до низкого.</div>
      </div>
    </div>
  );
}

function ViralPost() {
  return (
    <div style={{ width:1080, height:1080, background:'#000', position:'relative', fontFamily:'Montserrat,sans-serif', overflow:'hidden' }}>
      <div style={{ position:'absolute', bottom:72, left:72, right:72, borderTop:'1.5px solid rgba(255,255,255,0.18)', paddingTop:32, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <img src="../../assets/logo.png" style={{ width:72, height:72, objectFit:'contain' }} alt="logo" />
          <span style={{ fontSize:26, fontWeight:700, color:'rgba(255,255,255,0.6)', letterSpacing:'0.06em' }}>Поделиться</span>
        </div>
        <span style={{ fontSize:26, fontWeight:700, color:'rgba(255,255,255,0.6)', letterSpacing:'0.06em' }}>Сохранить</span>
      </div>
      <div style={{ position:'absolute', top:96, left:72, right:72 }}>
        <div style={{ fontSize:108, fontWeight:900, color:'#7FE030', lineHeight:1.0, letterSpacing:'-0.02em', textTransform:'uppercase', marginBottom:60 }}>Сколько денег брать во Вьетнам?</div>
        <div style={{ fontSize:40, fontWeight:400, color:'#fff', lineHeight:1.6, marginBottom:28 }}>Разберём по пунктам — от бюджетного до люксового отдыха.</div>
        <div style={{ fontSize:40, fontWeight:400, color:'rgba(255,255,255,0.72)', lineHeight:1.6 }}>Чтобы хватило на еду, жильё, экскурсии и форс-мажоры.</div>
      </div>
    </div>
  );
}

function TropicalPost() {
  const items = [
    { e:'🌊', n:'Хон Мун (Hòn Mun)', d:'Снорклинг, 2000+ видов кораллов, заповедник' },
    { e:'🎢', n:'Винперл (VinPearl)', d:'Парк развлечений, канатная дорога, 10 мин.' },
    { e:'🏖', n:'Хон Там (Hòn Tằm)', d:'Белоснежный пляж, живописный залив' },
  ];
  return (
    <div style={{ width:1080, height:1080, background:'linear-gradient(180deg,#083040 0%,#1E8AA8 55%,#36BEB0 100%)', position:'relative', fontFamily:'Montserrat,sans-serif', overflow:'hidden' }}>
      <div style={{ position:'absolute', top:80, left:72, right:72, background:'#F5C200', borderRadius:28, padding:'44px 52px' }}>
        <div style={{ fontSize:76, fontWeight:900, color:'#0D1741', lineHeight:1.08, textTransform:'uppercase', letterSpacing:'-0.01em' }}>Острова Нячанга: Какой выбрать?</div>
      </div>
      <div style={{ position:'absolute', bottom:80, left:72, right:72, display:'flex', flexDirection:'column', gap:18 }}>
        {items.map(({ e, n, d }) => (
          <div key={n} style={{ background:'rgba(255,255,255,0.92)', borderRadius:20, padding:'28px 32px', display:'flex', gap:24, alignItems:'center' }}>
            <span style={{ fontSize:48, flexShrink:0 }}>{e}</span>
            <div>
              <div style={{ fontSize:32, fontWeight:800, color:'#0D1741', marginBottom:6 }}>{n}</div>
              <div style={{ fontSize:26, color:'#484860', lineHeight:1.4 }}>{d}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function WarmPost() {
  return (
    <div style={{ width:1080, height:1080, background:'linear-gradient(140deg,#B83020 0%,#E8583A 30%,#E0A040 65%,#F5E4B8 100%)', position:'relative', fontFamily:'Montserrat,sans-serif', overflow:'hidden' }}>
      <img src="../../assets/logo.png" style={{ position:'absolute', top:60, right:60, width:108, height:108, objectFit:'contain', opacity:0.9 }} alt="logo" />
      <div style={{ position:'absolute', top:60, left:72 }}>
        <div style={{ display:'inline-flex', alignItems:'center', gap:12, background:'rgba(255,255,255,0.22)', backdropFilter:'blur(12px)', borderRadius:99, padding:'12px 28px', border:'1px solid rgba(255,255,255,0.35)' }}>
          <span style={{ fontSize:22, fontWeight:900, letterSpacing:'0.2em', textTransform:'uppercase', color:'#fff' }}>✈ VIP · Fast-Track</span>
        </div>
      </div>
      <div style={{ position:'absolute', top:200, left:72, right:72 }}>
        <div style={{ fontSize:88, fontWeight:900, color:'#fff', lineHeight:1.04, letterSpacing:'-0.02em', textTransform:'uppercase', textShadow:'0 4px 32px rgba(184,48,32,0.3)' }}>Fast-Track в аэропорту — как это работает?</div>
      </div>
      <div style={{ position:'absolute', bottom:88, left:72, right:72, background:'rgba(255,255,255,0.18)', backdropFilter:'blur(16px)', WebkitBackdropFilter:'blur(16px)', borderRadius:28, padding:'40px 44px', border:'1.5px solid rgba(255,255,255,0.35)' }}>
        <div style={{ fontSize:36, color:'#fff', lineHeight:1.6, fontWeight:400, marginBottom:24 }}>Пройди паспортный контроль за 5 минут. Без очередей, без стресса — прямо с трапа.</div>
        <div style={{ fontSize:26, color:'rgba(255,255,255,0.85)', fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase' }}>→ Заказать сейчас</div>
      </div>
    </div>
  );
}

// ── Template metadata ──────────────────────────────────────────

const TEMPLATES = {
  navy:     { Post: NavyPost,     label:'Премиум',  sub:'Navy Premium',  accent:'#C9941A', caption:'⏱ Реальные очереди в Камрань — от 20 минут до 3 часов. Разбираем по месяцам и сезонам.' },
  viral:    { Post: ViralPost,    label:'Вирусный', sub:'Viral Dark',    accent:'#7FE030', caption:'💸 Бюджет для Вьетнама — сколько реально нужно на 2 недели? Бюджетно и люксово.' },
  tropical: { Post: TropicalPost, label:'Тропик',   sub:'Tropical Info', accent:'#F5C200', caption:'🌊 Острова Нячанга — полный гид по 3 лучшим островам. Сохрани — пригодится!' },
  warm:     { Post: WarmPost,     label:'Закатный', sub:'Warm Coral',    accent:'#E8583A', caption:'✈️ Fast-Track в Камрань — VIP проход без очереди. Как заказать и сколько стоит?' },
};

// ── App ────────────────────────────────────────────────────────

function App() {
  const [active, setActive] = React.useState('navy');
  const tpl = TEMPLATES[active];
  const ActivePost = tpl.Post;

  return (
    <div style={{ fontFamily:'Montserrat,sans-serif', minHeight:'100vh', background:'#EAEAF0', paddingBottom:56 }}>

      {/* Header */}
      <div style={{ background:'#0D1741', padding:'18px 40px', display:'flex', alignItems:'center', gap:16, boxShadow:'0 4px 24px rgba(0,0,0,0.3)' }}>
        <img src="../../assets/logo.png" style={{ width:52, height:52, objectFit:'contain' }} alt="logo" />
        <div>
          <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.22em', textTransform:'uppercase', color:'#C9941A' }}>Nha Trang Insider</div>
          <div style={{ fontSize:20, fontWeight:800, color:'#fff', letterSpacing:'-0.01em' }}>Instagram Content System</div>
        </div>
        <div style={{ marginLeft:'auto', fontSize:12, color:'rgba(255,255,255,0.45)', fontWeight:600 }}>1080 × 1080 · Feed / Carousel</div>
      </div>

      {/* Thumbnails */}
      <div style={{ display:'flex', gap:20, padding:'28px 40px 20px', justifyContent:'center', flexWrap:'wrap' }}>
        {Object.entries(TEMPLATES).map(([id, t]) => {
          const isActive = active === id;
          const P = t.Post;
          return (
            <div key={id} onClick={() => setActive(id)} style={{ cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:10, transition:'200ms ease', transform: isActive ? 'translateY(-4px)' : 'none' }}>
              <div style={{ width:260, height:260, overflow:'hidden', borderRadius:isActive?18:12, boxShadow:isActive?`0 16px 48px rgba(0,0,0,0.28), 0 0 0 3px ${t.accent}`:'0 4px 16px rgba(0,0,0,0.14)', transition:'200ms ease' }}>
                <div style={{ width:1080, height:1080, transform:'scale(0.2407)', transformOrigin:'top left', pointerEvents:'none' }}>
                  <P />
                </div>
              </div>
              <div style={{ textAlign:'center' }}>
                <div style={{ fontSize:11, fontWeight:800, letterSpacing:'0.1em', textTransform:'uppercase', color:isActive?t.accent:'#2C2C40' }}>{t.label}</div>
                <div style={{ fontSize:9, color:'#9090A8', marginTop:2, fontWeight:600, letterSpacing:'0.06em' }}>{t.sub}</div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Large preview + info */}
      <div style={{ display:'flex', justifyContent:'center', padding:'0 40px', gap:40, flexWrap:'wrap' }}>
        <div style={{ width:480, height:480, overflow:'hidden', borderRadius:24, boxShadow:'0 24px 80px rgba(0,0,0,0.22)', flexShrink:0 }}>
          <div style={{ width:1080, height:1080, transform:'scale(0.4444)', transformOrigin:'top left', pointerEvents:'none' }}>
            <ActivePost />
          </div>
        </div>

        <div style={{ flex:1, minWidth:280, maxWidth:360, paddingTop:4, display:'flex', flexDirection:'column', gap:16 }}>
          <div>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.2em', textTransform:'uppercase', color:tpl.accent, marginBottom:6 }}>{tpl.sub}</div>
            <div style={{ fontSize:24, fontWeight:900, color:'#0D1741', letterSpacing:'-0.01em' }}>{tpl.label}</div>
          </div>
          <div style={{ background:'#fff', borderRadius:16, padding:'18px 20px', boxShadow:'0 2px 12px rgba(0,0,0,0.08)' }}>
            <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.15em', textTransform:'uppercase', color:'#9090A8', marginBottom:8 }}>Пример подписи</div>
            <div style={{ fontSize:14, color:'#2C2C40', lineHeight:1.65, fontFamily:'PT Sans,sans-serif' }}>{tpl.caption}</div>
          </div>
          <div style={{ background:'#fff', borderRadius:16, padding:'18px 20px', boxShadow:'0 2px 12px rgba(0,0,0,0.08)' }}>
            <div style={{ fontSize:9, fontWeight:700, letterSpacing:'0.15em', textTransform:'uppercase', color:'#9090A8', marginBottom:12 }}>Ключевые цвета</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              {[tpl.accent, '#0D1741', '#fff'].map(c => (
                <div key={c} style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <div style={{ width:18, height:18, borderRadius:4, background:c, boxShadow:'0 1px 4px rgba(0,0,0,0.15)', border:'1px solid rgba(0,0,0,0.08)' }} />
                  <span style={{ fontSize:10, fontWeight:700, color:'#484860', fontFamily:'Courier New,monospace' }}>{c}</span>
                </div>
              ))}
            </div>
          </div>
          <div style={{ fontSize:11, color:'#9090A8', fontWeight:500, lineHeight:1.5 }}>
            Все шаблоны 1080×1080 пикселей. Шрифты: Montserrat + PT Sans (кириллица).
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
