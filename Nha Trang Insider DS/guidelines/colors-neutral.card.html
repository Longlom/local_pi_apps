<!-- @dsCard group="Colors" viewport="700x110" name="Neutrals" subtitle="Full neutral scale — black to cream white" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: #EEEEF4; padding: 14px; }
    .row { display: flex; gap: 4px; height: 78px; }
    .sw { flex: 1; border-radius: 8px; padding: 6px 6px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; border: 1px solid rgba(0,0,0,0.06); }
    .nm { font-size: 7.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .hx { font-size: 9.5px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#0A0A0A"><span class="nm" style="color:rgba(255,255,255,.5)">Black</span><span class="hx" style="color:#fff">#0A0A0A</span></div>
    <div class="sw" style="background:var(--color-charcoal-900)"><span class="nm" style="color:rgba(255,255,255,.5)">Ch 900</span><span class="hx" style="color:#fff">#181828</span></div>
    <div class="sw" style="background:var(--color-charcoal-700)"><span class="nm" style="color:rgba(255,255,255,.5)">Ch 700</span><span class="hx" style="color:#fff">#2C2C40</span></div>
    <div class="sw" style="background:var(--color-charcoal-500)"><span class="nm" style="color:rgba(255,255,255,.5)">Ch 500</span><span class="hx" style="color:#fff">#484860</span></div>
    <div class="sw" style="background:var(--color-grey-700)"><span class="nm" style="color:rgba(255,255,255,.6)">Gr 700</span><span class="hx" style="color:#fff">#6A6A80</span></div>
    <div class="sw" style="background:var(--color-grey-500)"><span class="nm" style="color:rgba(255,255,255,.6)">Gr 500</span><span class="hx" style="color:#fff">#9090A8</span></div>
    <div class="sw" style="background:var(--color-grey-300)"><span class="nm" style="color:rgba(50,50,80,.5)">Gr 300</span><span class="hx" style="color:#2C2C40">#C4C4D4</span></div>
    <div class="sw" style="background:var(--color-grey-100)"><span class="nm" style="color:rgba(50,50,80,.5)">Gr 100</span><span class="hx" style="color:#2C2C40">#EEEEF6</span></div>
    <div class="sw" style="background:var(--color-cream)"><span class="nm" style="color:rgba(50,50,80,.5)">Cream</span><span class="hx" style="color:#2C2C40">#FFF8EE</span></div>
    <div class="sw" style="background:#FFFFFF"><span class="nm" style="color:rgba(50,50,80,.5)">White</span><span class="hx" style="color:#2C2C40">#FFFFFF</span></div>
  </div>
</body>
</html>
