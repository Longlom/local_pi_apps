<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); display: flex; height: 220px; }
    .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; }
    .label { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
    img { width: 120px; height: 120px; object-fit: contain; }
  </style>
</head>
<body>
  <div class="panel" style="background: var(--color-navy-900)">
    <img src="../assets/logo.png" alt="Nha Trang Insider logo">
    <span class="label" style="color: var(--color-gold-300)">On Navy · Logo BG</span>
  </div>
  <div class="panel" style="background: var(--color-cream)">
    <img src="../assets/logo.png" alt="Nha Trang Insider logo">
    <span class="label" style="color: var(--color-navy-700)">On Cream · Light BG</span>
  </div>
  <div class="panel" style="background: #0A0A0A">
    <img src="../assets/logo.png" alt="Nha Trang Insider logo">
    <span class="label" style="color: var(--color-grey-500)">On Black · Viral</span>
  </div>
</body>
</html>
