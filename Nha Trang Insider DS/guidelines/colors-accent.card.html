<!-- @dsCard group="Colors" viewport="700x110" name="Accent: Lime + Amber" subtitle="Viral lime for dark-mode hooks; amber for tropical/info posts" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: #EEEEF4; padding: 14px; }
    .row { display: flex; gap: 5px; height: 78px; }
    .sw { flex: 1; border-radius: 10px; padding: 7px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .nm { font-size: 8px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
    .hx { font-size: 10px; font-weight: 800; }
    .div { width: 1.5px; background: #C8C8D8; border-radius: 2px; margin: 4px 2px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#0A0A0A"><span class="nm" style="color:rgba(127,224,48,.6)">Lime · Dark</span><span class="hx" style="color:var(--color-lime-500)">#7FE030</span></div>
    <div class="sw" style="background:var(--color-lime-500)"><span class="nm" style="color:rgba(10,10,10,.55)">500</span><span class="hx" style="color:#0A0A0A">#7FE030</span></div>
    <div class="sw" style="background:var(--color-lime-400)"><span class="nm" style="color:rgba(10,10,10,.5)">400</span><span class="hx" style="color:#0A0A0A">#96E84C</span></div>
    <div class="div"></div>
    <div class="sw" style="background:var(--color-amber-500)"><span class="nm" style="color:rgba(13,23,65,.6)">Amber 500</span><span class="hx" style="color:#0D1741">#F5C200</span></div>
    <div class="sw" style="background:var(--color-amber-300)"><span class="nm" style="color:rgba(13,23,65,.5)">300</span><span class="hx" style="color:#0D1741">#FAD840</span></div>
    <div class="sw" style="background:var(--color-amber-100)"><span class="nm" style="color:rgba(13,23,65,.5)">100</span><span class="hx" style="color:#0D1741">#FDF2B0</span></div>
  </div>
</body>
</html>
