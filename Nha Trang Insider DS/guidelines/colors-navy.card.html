<!-- @dsCard group="Colors" viewport="700x110" name="Navy" subtitle="6-stop scale — logo, dark slides, deep backgrounds" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: #EEEEF4; padding: 14px; }
    .row { display: flex; gap: 5px; height: 78px; }
    .sw { flex: 1; border-radius: 10px; padding: 7px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .nm { font-size: 8px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
    .hx { font-size: 10px; font-weight: 800; color: #fff; }
  </style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--color-navy-950)"><span class="nm">950</span><span class="hx">#06091C</span></div>
    <div class="sw" style="background: var(--color-navy-900)"><span class="nm">900 · Logo</span><span class="hx">#0D1741</span></div>
    <div class="sw" style="background: var(--color-navy-800)"><span class="nm">800</span><span class="hx">#142256</span></div>
    <div class="sw" style="background: var(--color-navy-700)"><span class="nm">700</span><span class="hx">#1B2D6B</span></div>
    <div class="sw" style="background: var(--color-navy-600)"><span class="nm">600</span><span class="hx">#223880</span></div>
    <div class="sw" style="background: var(--color-navy-500)"><span class="nm">500</span><span class="hx">#2A4495</span></div>
  </div>
</body>
</html>
