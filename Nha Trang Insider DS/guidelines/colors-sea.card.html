<!-- @dsCard group="Colors" viewport="700x200" name="Sea + Turquoise" subtitle="Ocean palette — sea depth, turquoise reefs, tropical water" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: #EEEEF4; padding: 14px; display: flex; flex-direction: column; gap: 7px; }
    .label { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; color: #8888A0; text-transform: uppercase; }
    .row { display: flex; gap: 5px; height: 66px; }
    .sw { flex: 1; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .nm { font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .hx { font-size: 10px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="label">Ocean</div>
  <div class="row">
    <div class="sw" style="background:var(--color-sea-900)"><span class="nm" style="color:rgba(255,255,255,.55)">900</span><span class="hx" style="color:#fff">#083040</span></div>
    <div class="sw" style="background:var(--color-sea-700)"><span class="nm" style="color:rgba(255,255,255,.6)">700</span><span class="hx" style="color:#fff">#0F5870</span></div>
    <div class="sw" style="background:var(--color-sea-500)"><span class="nm" style="color:rgba(255,255,255,.65)">500</span><span class="hx" style="color:#fff">#1E8AA8</span></div>
    <div class="sw" style="background:var(--color-sea-300)"><span class="nm" style="color:rgba(8,48,64,.55)">300</span><span class="hx" style="color:#083040">#5CB8CC</span></div>
    <div class="sw" style="background:var(--color-sea-100)"><span class="nm" style="color:rgba(8,48,64,.55)">100</span><span class="hx" style="color:#083040">#C0E8F4</span></div>
  </div>
  <div class="label">Turquoise</div>
  <div class="row">
    <div class="sw" style="background:var(--color-turq-500)"><span class="nm" style="color:rgba(255,255,255,.65)">500</span><span class="hx" style="color:#fff">#36BEB0</span></div>
    <div class="sw" style="background:var(--color-turq-300)"><span class="nm" style="color:rgba(8,48,64,.55)">300</span><span class="hx" style="color:#083040">#70D4CC</span></div>
    <div class="sw" style="background:var(--color-turq-100)"><span class="nm" style="color:rgba(8,48,64,.55)">100</span><span class="hx" style="color:#083040">#C8F0EC</span></div>
    <div class="sw" style="background:var(--gradient-sea)"><span class="nm" style="color:rgba(255,255,255,.65)">Gradient</span><span class="hx" style="color:#fff">Deep Sea</span></div>
    <div class="sw" style="background:var(--gradient-beach)"><span class="nm" style="color:rgba(13,23,65,.55)">Gradient</span><span class="hx" style="color:#0D1741">Beach</span></div>
  </div>
</body>
</html>
