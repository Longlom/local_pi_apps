<!-- @dsCard group="Colors" viewport="700x110" name="Gold" subtitle="5-stop warm gold + metallic gradient — logo ring, accents, CTAs" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: #EEEEF4; padding: 14px; }
    .row { display: flex; gap: 5px; height: 78px; }
    .sw { flex: 1; border-radius: 10px; padding: 7px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .nm { font-size: 8px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
    .hx { font-size: 10px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--color-gold-900)"><span class="nm" style="color: rgba(255,220,100,.65)">900</span><span class="hx" style="color: #E8C86A">#7A5500</span></div>
    <div class="sw" style="background: var(--color-gold-700)"><span class="nm" style="color: rgba(255,230,140,.65)">700</span><span class="hx" style="color: #F5E4B8">#A87210</span></div>
    <div class="sw" style="background: var(--color-gold-500)"><span class="nm" style="color: rgba(13,23,65,.6)">500 · Brand</span><span class="hx" style="color: #0D1741">#C9941A</span></div>
    <div class="sw" style="background: var(--color-gold-300)"><span class="nm" style="color: rgba(122,85,0,.6)">300</span><span class="hx" style="color: #7A5500">#E8C86A</span></div>
    <div class="sw" style="background: var(--color-gold-100)"><span class="nm" style="color: rgba(168,114,16,.7)">100</span><span class="hx" style="color: #A87210">#F5E4B8</span></div>
    <div class="sw" style="background: var(--gradient-gold)"><span class="nm" style="color: rgba(13,23,65,.55)">Gradient</span><span class="hx" style="color: #0D1741">Metallic</span></div>
  </div>
</body>
</html>
