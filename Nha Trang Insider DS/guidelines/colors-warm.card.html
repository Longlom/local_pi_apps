<!-- @dsCard group="Colors" viewport="700x200" name="Warm: Coral + Sand" subtitle="Sunset direction — coral CTAs, sand backgrounds, warm accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: #EEEEF4; padding: 14px; display: flex; flex-direction: column; gap: 7px; }
    .label { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; color: #8888A0; text-transform: uppercase; }
    .row { display: flex; gap: 5px; height: 66px; }
    .sw { flex: 1; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .nm { font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .hx { font-size: 10px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="label">Coral</div>
  <div class="row">
    <div class="sw" style="background: var(--color-coral-700)"><span class="nm" style="color:rgba(255,255,255,.55)">700</span><span class="hx" style="color:#fff">#B83020</span></div>
    <div class="sw" style="background: var(--color-coral-500)"><span class="nm" style="color:rgba(255,255,255,.65)">500 · CTA</span><span class="hx" style="color:#fff">#E8583A</span></div>
    <div class="sw" style="background: var(--color-coral-400)"><span class="nm" style="color:rgba(255,255,255,.65)">400</span><span class="hx" style="color:#fff">#F07058</span></div>
    <div class="sw" style="background: var(--color-coral-300)"><span class="nm" style="color:rgba(184,48,32,.55)">300</span><span class="hx" style="color:#B83020">#F4977E</span></div>
    <div class="sw" style="background: var(--color-coral-100)"><span class="nm" style="color:rgba(184,48,32,.55)">100</span><span class="hx" style="color:#B83020">#FDDDD6</span></div>
  </div>
  <div class="label">Sand</div>
  <div class="row">
    <div class="sw" style="background: var(--color-sand-700)"><span class="nm" style="color:rgba(255,255,255,.55)">700</span><span class="hx" style="color:#fff">#C07820</span></div>
    <div class="sw" style="background: var(--color-sand-500)"><span class="nm" style="color:rgba(255,255,255,.65)">500</span><span class="hx" style="color:#fff">#E0A040</span></div>
    <div class="sw" style="background: var(--color-sand-300)"><span class="nm" style="color:rgba(192,120,32,.55)">300</span><span class="hx" style="color:#C07820">#F0C88A</span></div>
    <div class="sw" style="background: var(--color-sand-100)"><span class="nm" style="color:rgba(192,120,32,.55)">100</span><span class="hx" style="color:#C07820">#FBF0DC</span></div>
    <div class="sw" style="background: var(--gradient-sunset)"><span class="nm" style="color:rgba(13,23,65,.55)">Gradient</span><span class="hx" style="color:#0D1741">Sunset</span></div>
  </div>
</body>
</html>
