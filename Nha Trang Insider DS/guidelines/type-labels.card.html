<!-- @dsCard group="Type" viewport="700x200" name="Labels: Oswald" subtitle="Condensed punchy labels — service titles, badges, info headers (Cyrillic-ready)" -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-label); background: #FAFAFA; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #EEEEF4; padding-bottom: 14px; }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .meta { min-width: 72px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9090A8; font-family: var(--font-display); }
  </style>
</head>
<body>
  <div class="row">
    <span class="meta">700<br>Bold</span>
    <span style="font-size:28px;font-weight:700;color:var(--color-navy-900);text-transform:uppercase;letter-spacing:0.05em">FAST-TRACK КАМРАНЬ</span>
  </div>
  <div class="row">
    <span class="meta">600<br>Semi</span>
    <span style="font-size:22px;font-weight:600;color:var(--color-coral-500);text-transform:uppercase;letter-spacing:0.05em">VIP ТРАНСФЕР</span>
  </div>
  <div class="row">
    <span class="meta">500<br>Medium</span>
    <span style="font-size:18px;font-weight:500;color:var(--color-gold-500);text-transform:uppercase;letter-spacing:0.08em">ОСТРОВА НЯЧАНГА</span>
  </div>
  <div class="row">
    <span class="meta">400<br>Regular</span>
    <span style="font-size:15px;font-weight:400;color:var(--color-charcoal-500);text-transform:uppercase;letter-spacing:0.12em">СОВЕТЫ ТУРИСТАМ · ВИЗА · ОТЕЛИ</span>
  </div>
</body>
</html>
