<!-- @dsCard group="Type" viewport="700x310" name="Display: Montserrat" subtitle="Bold display type — headlines, carousel titles, story hooks (Cyrillic-ready)" -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-display); background: #FAFAFA; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: baseline; gap: 14px; }
    .meta { min-width: 72px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9090A8; line-height: 1; }
    .sample { color: var(--color-navy-900); line-height: var(--line-height-tight); }
    hr { border: none; border-top: 1px solid #EEEEF4; }
  </style>
</head>
<body>
  <div class="row">
    <span class="meta">900<br>Black<br>–0.03em</span>
    <span class="sample" style="font-size:52px;font-weight:900;letter-spacing:var(--letter-spacing-tight)">НЬА ЧАНГ</span>
  </div>
  <hr>
  <div class="row">
    <span class="meta">800<br>Extra Bold<br>–0.02em</span>
    <span class="sample" style="font-size:36px;font-weight:800;letter-spacing:-0.02em;text-transform:uppercase">БЫСТРЫЙ ПРОХОД</span>
  </div>
  <hr>
  <div class="row">
    <span class="meta">700<br>Bold<br>+0.05em</span>
    <span class="sample" style="font-size:24px;font-weight:700;letter-spacing:var(--letter-spacing-wide);text-transform:uppercase">VIP Трансфер в Аэропорту</span>
  </div>
  <hr>
  <div class="row">
    <span class="meta">600<br>Semi Bold<br>Normal</span>
    <span class="sample" style="font-size:18px;font-weight:600;color:#484860">Лучшие советы для туристов во Вьетнаме</span>
  </div>
</body>
</html>
