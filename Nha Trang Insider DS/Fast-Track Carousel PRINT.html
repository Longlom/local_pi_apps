<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Fast Track Carousel — Print Export</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <template id="__bundler_thumbnail">
  <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
    <rect width="80" height="56" fill="#E8583A"/>
    <rect x="8" y="6" width="28" height="44" rx="3" fill="#B83020"/>
    <rect x="44" y="6" width="28" height="44" rx="3" fill="#B83020"/>
    <text x="22" y="32" font-size="8" fill="#F5C200" text-anchor="middle" font-weight="bold">FT</text>
    <text x="58" y="32" font-size="8" fill="#F5C200" text-anchor="middle" font-weight="bold">FT</text>
  </svg>
</template>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; }
    .slide-wrapper { width: 1080px; height: 1350px; display: block; }
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body { background: white; }
      .slide-wrapper { page-break-after: always; break-after: page; }
      .no-print { display: none !important; }
      @page { size: 1080px 1350px; margin: 0; }
    }
    @media screen {
      body { padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 0; }
      .slide-wrapper { margin-bottom: 40px; border-radius: 20px; overflow: hidden;
        box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
      .hint { color: #fff; font-family: 'PT Sans', sans-serif; font-size: 14px; text-align: center;
        margin-bottom: 32px; opacity: 0.6; line-height: 1.6; }
      .print-btn { background: linear-gradient(135deg,#A87210,#C9941A,#E8C86A,#C9941A);
        color: #0D1741; font-family: 'Montserrat', sans-serif; font-weight: 800;
        font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase;
        padding: 16px 40px; border: none; border-radius: 999px; cursor: pointer;
        margin-bottom: 40px; box-shadow: 0 8px 32px rgba(201,148,26,0.45); }
    }
  </style>
</head>
<body>
<div class="no-print hint">
  6 слайдов · 1080 × 1350 px каждый<br>
  Нажми кнопку ниже → сохрани как PDF → разрежь на отдельные страницы
</div>
<button class="no-print print-btn" onclick="window.print()">⬇ Сохранить как PDF</button>
<div id="root"></div>

<script type="text/babel">
const LOGO = 'assets/logo-circle.png';
const W = 1080, H = 1350;

const BG = {
  a: 'linear-gradient(155deg,#A82818 0%,#E8583A 34%,#E0A040 70%,#F5E4B8 100%)',
  b: 'radial-gradient(120% 90% at 80% 0%,#F0A848 0%,#E8583A 45%,#B83020 100%)',
  c: 'linear-gradient(200deg,#B83020 0%,#E8583A 38%,#E0A040 78%,#F7EAD0 100%)',
  d: 'linear-gradient(155deg,#8C1E10 0%,#D14228 40%,#E8583A 100%)',
};
const STARS = [
  {top:'7%',left:'14%',s:7},{top:'11%',left:'68%',s:5},{top:'18%',left:'44%',s:9},
  {top:'5%',left:'88%',s:5},{top:'22%',left:'82%',s:4},{top:'14%',left:'30%',s:6},
  {top:'28%',left:'56%',s:4},{top:'9%',left:'52%',s:7},{top:'20%',left:'12%',s:4},
  {top:'32%',left:'90%',s:6},{top:'6%',left:'76%',s:5},{top:'25%',left:'38%',s:3},
];
const TS = '0 3px 24px rgba(140,30,16,0.35)';

function Glow() {
  return <div style={{position:'absolute',top:-220,right:-180,width:700,height:700,background:'radial-gradient(circle,rgba(255,240,200,0.45) 0%,rgba(255,240,200,0) 65%)',pointerEvents:'none'}} />;
}
function Kicker({children,color='rgba(255,255,255,0.92)'}) {
  return (
    <div style={{display:'inline-flex',alignItems:'center',gap:14,background:'rgba(13,23,65,0.16)',backdropFilter:'blur(8px)',border:'1.5px solid rgba(255,255,255,0.35)',borderRadius:999,padding:'14px 30px'}}>
      <span style={{fontFamily:'Oswald,sans-serif',fontSize:24,fontWeight:600,letterSpacing:'0.18em',textTransform:'uppercase',color}}>{children}</span>
    </div>
  );
}
function Frame({bg,num,children}) {
  return (
    <div style={{width:W,height:H,background:bg,position:'relative',overflow:'hidden',fontFamily:'Montserrat,sans-serif'}}>
      <Glow/>
      <img src={LOGO} alt="" style={{position:'absolute',top:52,right:52,width:108,height:108,objectFit:'contain',filter:'drop-shadow(0 6px 20px rgba(140,30,16,0.4))'}}/>
      <div style={{position:'absolute',top:80,left:64,display:'flex',gap:8}}>
        {[0,1,2,3,4,5].map(i=><div key={i} style={{width:34,height:6,borderRadius:3,background:i<num?'#fff':'rgba(255,255,255,0.32)'}}/>)}
      </div>
      {children}
    </div>
  );
}

function Slide1() {
  return (
    <Frame bg={BG.b} num={1}>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 80px'}}>
        <div style={{marginBottom:40}}><Kicker>VIP-сервис · Камрань</Kicker></div>
        <div style={{fontSize:130,fontWeight:900,color:'#fff',lineHeight:0.98,letterSpacing:'-0.03em',textTransform:'uppercase',textShadow:TS,marginBottom:36}}>Что такое<br/>Fast<br/>Track?</div>
        <div style={{fontFamily:'PT Sans,sans-serif',fontSize:40,color:'rgba(255,255,255,0.92)',lineHeight:1.45,maxWidth:760}}>Разбираем по полочкам — что это, что входит и кому особенно нужно.</div>
      </div>
      <div style={{position:'absolute',bottom:70,left:80,display:'flex',alignItems:'center',gap:16}}>
        <span style={{fontFamily:'Oswald,sans-serif',fontSize:28,fontWeight:600,letterSpacing:'0.16em',textTransform:'uppercase',color:'#fff'}}>Листай</span>
        <span style={{fontSize:40,color:'#fff'}}>→</span>
      </div>
    </Frame>
  );
}
function Slide2() {
  return (
    <Frame bg={BG.a} num={2}>
      <div style={{position:'absolute',top:200,left:80,right:80}}>
        <div style={{marginBottom:36}}><Kicker>Простыми словами</Kicker></div>
        <div style={{fontSize:78,fontWeight:900,color:'#fff',lineHeight:1.06,letterSpacing:'-0.02em',textTransform:'uppercase',textShadow:TS}}>Твой личный VIP-проход через аэропорт</div>
      </div>
      <div style={{position:'absolute',bottom:110,left:80,right:80,background:'rgba(255,255,255,0.18)',backdropFilter:'blur(18px)',WebkitBackdropFilter:'blur(18px)',borderRadius:32,border:'1.5px solid rgba(255,255,255,0.4)',padding:'48px 52px'}}>
        <div style={{fontFamily:'PT Sans,sans-serif',fontSize:42,color:'#fff',lineHeight:1.5}}>
          Персональный сопровождающий встречает тебя <b>прямо у трапа</b> и проводит через все формальности по отдельному коридору — мимо общих очередей.
        </div>
      </div>
    </Frame>
  );
}
function Slide3() {
  const items=[['🛬','Встреча у трапа самолёта с табличкой'],['🛂','Отдельный коридор на паспортном контроле'],['🧳','Помощь с багажом и тележкой'],['🚐','Сопровождение до выхода или трансфера']];
  return (
    <Frame bg={BG.c} num={3}>
      <div style={{position:'absolute',top:200,left:80,right:80}}>
        <div style={{marginBottom:32}}><Kicker color="#0D1741">Что входит</Kicker></div>
        <div style={{fontSize:96,fontWeight:900,color:'#fff',lineHeight:1,letterSpacing:'-0.02em',textTransform:'uppercase',textShadow:TS}}>Всё включено</div>
      </div>
      <div style={{position:'absolute',bottom:96,left:80,right:80,display:'flex',flexDirection:'column',gap:20}}>
        {items.map(([e,t],i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:28,background:'rgba(255,255,255,0.92)',borderRadius:24,padding:'30px 36px',boxShadow:'0 8px 28px rgba(140,30,16,0.18)'}}>
            <span style={{fontSize:52,flexShrink:0}}>{e}</span>
            <span style={{fontFamily:'PT Sans,sans-serif',fontSize:38,fontWeight:700,color:'#0D1741',lineHeight:1.25}}>{t}</span>
          </div>
        ))}
      </div>
    </Frame>
  );
}
function Slide4() {
  return (
    <Frame bg={BG.d} num={4}>
      <div style={{position:'absolute',top:200,left:80,right:80}}>
        <div style={{marginBottom:32}}><Kicker>Экономия времени</Kicker></div>
        <div style={{fontSize:92,fontWeight:900,color:'#fff',lineHeight:1,letterSpacing:'-0.02em',textTransform:'uppercase',textShadow:TS}}>Почувствуй разницу</div>
      </div>
      <div style={{position:'absolute',bottom:120,left:80,right:80,display:'flex',flexDirection:'column',gap:24}}>
        <div style={{background:'rgba(13,23,65,0.34)',borderRadius:28,padding:'40px 44px',border:'1.5px solid rgba(255,255,255,0.18)'}}>
          <div style={{fontFamily:'Oswald,sans-serif',fontSize:26,fontWeight:500,letterSpacing:'0.14em',textTransform:'uppercase',color:'rgba(255,255,255,0.65)',marginBottom:10}}>Без Fast Track</div>
          <div style={{fontSize:72,fontWeight:900,color:'#fff',lineHeight:1}}>до 3 часов <span style={{fontSize:38,fontWeight:600,color:'rgba(255,255,255,0.7)'}}>в очередях</span></div>
        </div>
        <div style={{background:'var(--gradient-gold)',borderRadius:28,padding:'40px 44px',boxShadow:'0 16px 48px rgba(201,148,26,0.4)'}}>
          <div style={{fontFamily:'Oswald,sans-serif',fontSize:26,fontWeight:600,letterSpacing:'0.14em',textTransform:'uppercase',color:'rgba(13,23,65,0.6)',marginBottom:10}}>С Fast Track</div>
          <div style={{fontSize:72,fontWeight:900,color:'#0D1741',lineHeight:1}}>15 минут <span style={{fontSize:38,fontWeight:600,color:'rgba(13,23,65,0.6)'}}>— и ты свободен</span></div>
        </div>
      </div>
    </Frame>
  );
}
function Slide5() {
  const items=[['👨‍👩‍👧','Летишь с детьми'],['😴','После долгого перелёта'],['🔥','В пик сезона (дек–март)'],['⏱','Когда время дороже денег']];
  return (
    <Frame bg={BG.a} num={5}>
      <div style={{position:'absolute',top:200,left:80,right:80}}>
        <div style={{marginBottom:32}}><Kicker>Кому особенно нужно</Kicker></div>
        <div style={{fontSize:88,fontWeight:900,color:'#fff',lineHeight:1.02,letterSpacing:'-0.02em',textTransform:'uppercase',textShadow:TS}}>Это про тебя, если…</div>
      </div>
      <div style={{position:'absolute',bottom:110,left:80,right:80,display:'grid',gridTemplateColumns:'1fr 1fr',gap:22}}>
        {items.map(([e,t],i)=>(
          <div key={i} style={{background:'rgba(255,255,255,0.16)',backdropFilter:'blur(14px)',border:'1.5px solid rgba(255,255,255,0.34)',borderRadius:26,padding:'34px 30px',display:'flex',flexDirection:'column',gap:18,minHeight:230,justifyContent:'center'}}>
            <span style={{fontSize:64}}>{e}</span>
            <span style={{fontFamily:'PT Sans,sans-serif',fontSize:36,fontWeight:700,color:'#fff',lineHeight:1.2}}>{t}</span>
          </div>
        ))}
      </div>
    </Frame>
  );
}
function Slide6() {
  return (
    <Frame bg={BG.b} num={6}>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 80px',textAlign:'center'}}>
        <img src={LOGO} alt="" style={{width:240,height:240,objectFit:'contain',marginBottom:48,filter:'drop-shadow(0 10px 32px rgba(140,30,16,0.45))'}}/>
        <div style={{fontSize:84,fontWeight:900,color:'#fff',lineHeight:1.04,letterSpacing:'-0.02em',textTransform:'uppercase',textShadow:TS,marginBottom:32}}>Закажи Fast Track заранее</div>
        <div style={{fontFamily:'PT Sans,sans-serif',fontSize:40,color:'rgba(255,255,255,0.92)',lineHeight:1.45,maxWidth:780,marginBottom:52}}>Напиши нам в Direct — забронируем твой VIP-проход на нужную дату и рейс.</div>
        <div style={{display:'inline-flex',alignItems:'center',gap:18,background:'var(--gradient-gold)',borderRadius:999,padding:'30px 60px',boxShadow:'0 16px 48px rgba(201,148,26,0.45)'}}>
          <span style={{fontFamily:'Montserrat,sans-serif',fontSize:38,fontWeight:800,letterSpacing:'0.04em',textTransform:'uppercase',color:'#0D1741'}}>Написать в Direct</span>
          <span style={{fontSize:40,color:'#0D1741'}}>→</span>
        </div>
        <div style={{position:'absolute',bottom:70,fontFamily:'Oswald,sans-serif',fontSize:30,fontWeight:500,letterSpacing:'0.16em',color:'#fff'}}>@nhatrang.insider</div>
      </div>
    </Frame>
  );
}

const SLIDES = [Slide1, Slide2, Slide3, Slide4, Slide5, Slide6];

function App() {
  return (
    <div>
      {SLIDES.map((S, i) => (
        <div key={i} className="slide-wrapper" data-document-role="page" data-label={`Слайд ${i+1}`}><S /></div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
